<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Matrimony</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7f8;
      color: #333;
      text-align: center;
    }
    header {
      background: #8b1538;
      color: white;
      padding: 25px 10px;
    }
    h1 { margin: 0; }
    .container { padding: 20px; }
    .card {
      background: white;
      margin: 15px auto;
      padding: 20px;
      max-width: 350px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #ddd;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #8b1538;
      color: white;
      border: none;
      cursor: pointer;
    }
    .price { color: #8b1538; font-size: 24px; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>Elite Matrimony</h1>
    <p>તમારા જીવનસાથીની શોધ અહીંથી શરૂ કરો</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>નવું એકાઉન્ટ બનાવો</h2>
      <input id="name" placeholder="તમારું નામ">
      <input id="email" type="email" placeholder="ઈમેઇલ">
      <input id="password" type="password" placeholder="પાસવર્ડ">
      <button onclick="register()">Register</button>
      <button onclick="login()">Login</button>
      <p id="message"></p>
    </div>

    <h2>Premium Membership Plans</h2>

    <div class="card">
      <h3>1 Month Plan</h3>
      <p class="price">₹999</p>
    </div>

    <div class="card">
      <h3>3 Months Plan</h3>
      <p class="price">₹2,499</p>
    </div>

    <div class="card">
      <h3>6 Months Plan</h3>
      <p class="price">₹3,999</p>
    </div>

    <div class="card">
      <h3>12 Months Plan</h3>
      <p class="price">₹5,999</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://zwgdqsskwskgthytdahl.supabase.co";

    const SUPABASE_KEY =
      "તમારી_PUBLIC_KEY_અહીં_પેસ્ટ_કરો";

    const db = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY
    );

    async function register() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!name || !email || password.length < 6) {
        document.getElementById("message").textContent =
          "નામ, સાચું ઈમેઇલ અને ઓછામાં ઓછા 6 અક્ષરનો પાસવર્ડ નાખો.";
        return;
      }

      const { error } = await db.auth.signUp({
        email,
        password,
        options: { data: { full_name: name } }
      });

      document.getElementById("message").textContent =
        error ? error.message : "રજિસ્ટ્રેશન થયું. ઈમેઇલ ચેક કરો.";
    }

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await db.auth.signInWithPassword({
        email, password
      });

      document.getElementById("message").textContent =
        error ? error.message : "લૉગિન સફળ થયું!";
    }
  </script>
</body>
</html>
